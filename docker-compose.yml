services:
  mysql-master:
    image: mysql:8.0
    container_name: mysql-master
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: coinwise
    ports:
      - "3306:3306"
    volumes:
      - mysql-master-data:/var/lib/mysql
      - ./docker/mysql-master/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./docker/mysql-master/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - coinwise-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql-slave:
    image: mysql:8.0
    container_name: mysql-slave
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: coinwise
    ports:
      - "3307:3306"
    volumes:
      - mysql-slave-data:/var/lib/mysql
      - ./docker/mysql-slave/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./docker/mysql-slave/init.sh:/usr/local/bin/init-slave.sh
    entrypoint: ["/bin/bash", "/usr/local/bin/init-slave.sh"]
    depends_on:
      mysql-master:
        condition: service_healthy
    networks:
      - coinwise-network

  redis-master:
    image: redis:7-alpine
    container_name: redis-master
    ports:
      - "6379:6379"
    volumes:
      - redis-master-data:/data
      - ./docker/redis-master/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - coinwise-network

  redis-sentinel-1:
    image: redis:7-alpine
    container_name: redis-sentinel-1
    ports:
      - "26379:26379"
    volumes:
      - ./docker/redis-sentinel/sentinel.conf:/usr/local/etc/redis/sentinel.conf
    command: redis-server /usr/local/etc/redis/sentinel.conf --sentinel
    depends_on:
      - redis-master
    networks:
      - coinwise-network

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: redis-sentinel-2
    ports:
      - "26380:26379"
    volumes:
      - ./docker/redis-sentinel/sentinel.conf:/usr/local/etc/redis/sentinel.conf
    command: redis-server /usr/local/etc/redis/sentinel.conf --sentinel
    depends_on:
      - redis-master
    networks:
      - coinwise-network

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: redis-sentinel-3
    ports:
      - "26381:26379"
    volumes:
      - ./docker/redis-sentinel/sentinel.conf:/usr/local/etc/redis/sentinel.conf
    command: redis-server /usr/local/etc/redis/sentinel.conf --sentinel
    depends_on:
      - redis-master
    networks:
      - coinwise-network

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - coinwise-network

  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi
    environment:
      - DATABASE_URL_MASTER=mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD}@mysql-master:3306/coinwise
      - DATABASE_URL_SLAVE=mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD}@mysql-slave:3306/coinwise
      - REDIS_URL=redis://redis-master:6379/0
      - ES_HOST=http://elasticsearch:9200
      - CELERY_BROKER_URL=redis://redis-master:6379/1
      - CELERY_RESULT_BACKEND=redis://redis-master:6379/2
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY in .env}
      - BAILIAN_API_KEY=${BAILIAN_API_KEY:-}
      - BAILIAN_MODEL=${BAILIAN_MODEL:-qwen-plus}
    ports:
      - "8000:8000"
    depends_on:
      mysql-master:
        condition: service_healthy
      redis-master:
        condition: service_started
      elasticsearch:
        condition: service_started
    networks:
      - coinwise-network
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: celery-worker
    environment:
      - DATABASE_URL_MASTER=mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD}@mysql-master:3306/coinwise
      - DATABASE_URL_SLAVE=mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD}@mysql-slave:3306/coinwise
      - REDIS_URL=redis://redis-master:6379/0
      - ES_HOST=http://elasticsearch:9200
      - CELERY_BROKER_URL=redis://redis-master:6379/1
      - CELERY_RESULT_BACKEND=redis://redis-master:6379/2
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY in .env}
      - BAILIAN_API_KEY=${BAILIAN_API_KEY:-}
      - BAILIAN_MODEL=${BAILIAN_MODEL:-qwen-plus}
    command: celery -A tasks.celery_app worker -l info
    depends_on:
      mysql-master:
        condition: service_healthy
      redis-master:
        condition: service_started
    networks:
      - coinwise-network
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: celery-beat
    environment:
      - DATABASE_URL_MASTER=mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD}@mysql-master:3306/coinwise
      - DATABASE_URL_SLAVE=mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD}@mysql-slave:3306/coinwise
      - REDIS_URL=redis://redis-master:6379/0
      - ES_HOST=http://elasticsearch:9200
      - CELERY_BROKER_URL=redis://redis-master:6379/1
      - CELERY_RESULT_BACKEND=redis://redis-master:6379/2
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY in .env}
      - BAILIAN_API_KEY=${BAILIAN_API_KEY:-}
      - BAILIAN_MODEL=${BAILIAN_MODEL:-qwen-plus}
    command: celery -A tasks.celery_app beat -l info
    depends_on:
      mysql-master:
        condition: service_healthy
      redis-master:
        condition: service_started
    networks:
      - coinwise-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - fastapi
    networks:
      - coinwise-network
    restart: unless-stopped

volumes:
  mysql-master-data:
  mysql-slave-data:
  redis-master-data:
  elasticsearch-data:

networks:
  coinwise-network:
    driver: bridge
