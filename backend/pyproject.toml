[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coinwise-backend"
version = "1.0.0"
description = "CoinWise AI - 智能记账与财务分析平台后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiomysql>=0.2.0",
    "alembic>=1.13.1",
    "celery[redis]>=5.4.0",
]

[tool.setuptools.packages.find]
include = ["*"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "alembic/versions/*"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "raise NotImplementedError",
]
